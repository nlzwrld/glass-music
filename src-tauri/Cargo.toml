[package]
name = "liquid-hub"
version = "2.2.0"
description = "Liquid Hub — Hub centralizado de músicas, catálogos e sessões ao vivo"
authors = ["Liquid Hub"]
edition = "2021"
license = "MIT"

[lib]
name = "liquid_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "query", "form", "blocking", "rustls"], default-features = false }
tokio = { version = "1", features = ["sync", "macros", "time", "process", "io-util"] }
tokio-util = "0.7"
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
ring = "0.17"
lofty = "0.25"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_Registry"] }
windows = { version = "0.62", features = ["Foundation", "System", "UI_Composition", "UI_Composition_Desktop", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_WinRT", "Win32_System_WinRT_Composition"] }
windows-numerics = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"

[profile.dev]
debug = 0

[profile.test]
debug = 0
