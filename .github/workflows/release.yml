name: Build and publish Liquid Hub
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**/*.md', 'deploy/**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquid-hub-release
  cancel-in-progress: false

jobs:
  validate:
    name: Reusable release validation
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Resolve immutable release metadata
    needs: validate
    runs-on: windows-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: metadata
        name: Resolve version and commit timestamp once
        shell: pwsh
        run: |
          $version = (node scripts/prepare-release.mjs --print-version).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Could not resolve release version.' }
          $timestamp = (git log -1 --format=%cI $env:GITHUB_SHA).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $timestamp) { throw 'Could not resolve commit timestamp.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "timestamp=$timestamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build-windows:
    name: Build signed Windows installer
    needs: [validate, prepare]
    runs-on: windows-latest
    env:
      CI: 'true'
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Provision and verify every declared catalog resource
        run: node scripts/configure-catalog.mjs --ensure-binaries
      - name: Apply resolved release version and channel
        run: node scripts/prepare-release.mjs --version "$env:RELEASE_VERSION"
      - name: Build signed Windows update
        run: pnpm dist
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Stage Windows installer and signature
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release/bundle/nsis'
          $setups = @(Get-ChildItem -LiteralPath $bundle -Filter "*_$($env:RELEASE_VERSION)_*-setup.exe" -File)
          if ($setups.Count -ne 1) { throw "Expected exactly one installer for $env:RELEASE_VERSION; found $($setups.Count)." }
          $setup = $setups[0]
          if (-not (Test-Path -LiteralPath "$($setup.FullName).sig" -PathType Leaf)) { throw "Installer signature missing: $($setup.FullName).sig" }

          $stage = Join-Path $env:RUNNER_TEMP 'windows-release'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $installer = Join-Path $stage $setup.Name.Replace(' ', '.')
          Copy-Item -LiteralPath $setup.FullName -Destination $installer -Force
          Copy-Item -LiteralPath "$($setup.FullName).sig" -Destination "$installer.sig" -Force
          Get-ChildItem -LiteralPath $stage | Select-Object Name, Length
      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: ${{ runner.temp }}/windows-release/*
          retention-days: 3

  build-android:
    name: Build signed Android APK & AAB (arm64-v8a)
    needs: [validate, prepare]
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      LIQUID_SKIP_YTDLP_DOWNLOAD: '1'
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK 36 & NDK 27
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android-arm64
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply resolved release version and compute Android versionCode
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs --version "$RELEASE_VERSION"
          IFS='.' read -r MAJ MIN PAT <<< "$RELEASE_VERSION"
          VERSION_CODE=$((MAJ * 100000 + MIN * 1000 + PAT))
          echo "LIQUID_ANDROID_VERSION_NAME=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "LIQUID_ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Android versionName=$RELEASE_VERSION versionCode=$VERSION_CODE"
      - name: Validate Android manifest config
        run: pnpm android:check
      - name: Build frontend bundle and stage catalog metadata
        run: node scripts/build.mjs
      - name: Initialize Tauri Android project
        run: pnpm exec tauri android init --ci
      - name: Apply Liquid Hub native Android media service, manifest & signing setup
        run: node scripts/android-setup.mjs
      - name: Configure Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          KS_PATH="${RUNNER_TEMP}/liquid-hub-release.keystore"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            KS_PASS="${ANDROID_KEYSTORE_PASS:?ANDROID_KEYSTORE_PASS secret required}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS:-liquidhub}"
            KEY_PASS="${ANDROID_KEY_PASS:-$KS_PASS}"
            echo "Using repository release keystore."
          else
            KS_PASS="liquidhub-beta-keystore"
            KEY_ALIAS="liquidhub"
            KEY_PASS="liquidhub-beta-keystore"
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Liquid Hub Android, OU=Mobile, O=Liquid Hub, L=Sao Paulo, ST=SP, C=BR"
            echo "Generated signed release keystore for sideloadable APK & AAB."
          fi
          echo "LIQUID_ANDROID_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "LIQUID_ANDROID_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "LIQUID_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LIQUID_ANDROID_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
      - name: Build signed Android APK (arm64-v8a)
        run: pnpm exec tauri android build --apk --target aarch64
      - name: Build signed Android AAB (arm64-v8a)
        run: pnpm exec tauri android build --aab --target aarch64
      - name: Stage and verify Android APK & AAB
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/android-release"
          mkdir -p "$OUT_DIR"

          APK_FILE="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*-unsigned.apk' | head -n 1 || true)"
          if [ -z "$APK_FILE" ]; then
            APK_FILE="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1 || true)"
          fi
          AAB_FILE="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' | head -n 1 || true)"

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Built APK not found!" >&2
            exit 1
          fi
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "Built AAB not found!" >&2
            exit 1
          fi

          APK_NAME="Liquid.Hub_${RELEASE_VERSION}_arm64.apk"
          AAB_NAME="Liquid.Hub_${RELEASE_VERSION}_arm64.aab"
          cp "$APK_FILE" "$OUT_DIR/$APK_NAME"
          cp "$AAB_FILE" "$OUT_DIR/$AAB_NAME"

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$OUT_DIR/$APK_NAME"
          fi

          (cd "$OUT_DIR" && sha256sum "$APK_NAME" "$AAB_NAME" > SHA256SUMS-android.txt)
          ls -lh "$OUT_DIR"
          cat "$OUT_DIR/SHA256SUMS-android.txt"
      - name: Upload Android release assets
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: ${{ runner.temp }}/android-release/*
          retention-days: 30

  publish:
    name: Reconcile and publish Desktop + Mobile release
    needs: [prepare, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: 'true'
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: ${{ runner.temp }}/liquid-hub-release
      - name: Download Android release assets
        uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: ${{ runner.temp }}/liquid-hub-release
      - name: Apply resolved release version and generate deterministic manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs --version "$RELEASE_VERSION"

          ASSET_DIR="${RUNNER_TEMP}/liquid-hub-release"
          INSTALLER="$(find "$ASSET_DIR" -maxdepth 1 -type f -name "*_${RELEASE_VERSION}_*-setup.exe" | head -n 1 || true)"
          APK="$ASSET_DIR/Liquid.Hub_${RELEASE_VERSION}_arm64.apk"
          AAB="$ASSET_DIR/Liquid.Hub_${RELEASE_VERSION}_arm64.aab"
          SUMS="$ASSET_DIR/SHA256SUMS-android.txt"

          if [ -z "$INSTALLER" ] || [ ! -f "$INSTALLER" ] || [ ! -f "${INSTALLER}.sig" ]; then
            echo "Windows installer or signature missing in $ASSET_DIR" >&2
            ls -la "$ASSET_DIR"
            exit 1
          fi
          if [ ! -f "$APK" ] || [ ! -f "$AAB" ] || [ ! -f "$SUMS" ]; then
            echo "Android APK/AAB/checksums missing in $ASSET_DIR" >&2
            ls -la "$ASSET_DIR"
            exit 1
          fi

          MANIFEST="$ASSET_DIR/latest.json"
          NOTES="$ASSET_DIR/release-notes.md"
          INVENTORY="${RUNNER_TEMP}/liquid-hub-release-artifacts.json"
          node scripts/update-manifest.mjs \
            --installer "$INSTALLER" \
            --extra-asset "$APK" \
            --extra-asset "$AAB" \
            --extra-asset "$SUMS" \
            --version "$RELEASE_VERSION" \
            --timestamp "$RELEASE_TIMESTAMP" \
            --output "$MANIFEST" \
            --notes-output "$NOTES" \
            --inventory "$INVENTORY"
      - name: Reconcile and publish unified Windows + Android release
        run: node scripts/publish-release.mjs --inventory "$RUNNER_TEMP/liquid-hub-release-artifacts.json" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - name: Sync floating android-beta prerelease channel
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="${RUNNER_TEMP}/liquid-hub-release"
          BETA_DIR="${RUNNER_TEMP}/android-beta-sync"
          mkdir -p "$BETA_DIR"
          cp "$ASSET_DIR/Liquid.Hub_${RELEASE_VERSION}_arm64.apk" "$BETA_DIR/Liquid-Hub-beta-arm64.apk"
          cp "$ASSET_DIR/Liquid.Hub_${RELEASE_VERSION}_arm64.aab" "$BETA_DIR/Liquid-Hub-beta-arm64.aab"
          (cd "$BETA_DIR" && sha256sum Liquid-Hub-beta-arm64.apk Liquid-Hub-beta-arm64.aab > SHA256SUMS-android-beta.txt)

          NOTES_FILE="$BETA_DIR/android-beta-notes.md"
          cat > "$NOTES_FILE" <<EOF
          ## Liquid Hub Android (${RELEASE_VERSION})

          Sincronizado automaticamente com a release oficial [\`v${RELEASE_VERSION}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION}).

          ### Arquivos
          - **\`Liquid-Hub-beta-arm64.apk\`** — instalação direta (Android 8.0+, arm64-v8a)
          - **\`Liquid-Hub-beta-arm64.aab\`** — Android App Bundle (Google Play)

          \`\`\`
          $(cat "$BETA_DIR/SHA256SUMS-android-beta.txt")
          \`\`\`
          EOF

          if gh release view android-beta >/dev/null 2>&1; then
            gh release edit android-beta \
              --title "Liquid Hub Android (${RELEASE_VERSION})" \
              --notes-file "$NOTES_FILE" \
              --prerelease
            gh release upload android-beta \
              "$BETA_DIR/Liquid-Hub-beta-arm64.apk" \
              "$BETA_DIR/Liquid-Hub-beta-arm64.aab" \
              "$BETA_DIR/SHA256SUMS-android-beta.txt" \
              --clobber
          else
            gh release create android-beta \
              "$BETA_DIR/Liquid-Hub-beta-arm64.apk" \
              "$BETA_DIR/Liquid-Hub-beta-arm64.aab" \
              "$BETA_DIR/SHA256SUMS-android-beta.txt" \
              --title "Liquid Hub Android (${RELEASE_VERSION})" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
      - name: Upload release diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/liquid-hub-release/latest.json
            ${{ runner.temp }}/liquid-hub-release/release-notes.md
            ${{ runner.temp }}/liquid-hub-release-artifacts.json
          if-no-files-found: ignore
          retention-days: 7
