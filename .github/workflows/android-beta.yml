name: Liquid Hub Android Beta (APK & AAB)

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**/*.md', 'deploy/**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liquid-hub-android-beta
  cancel-in-progress: true

jobs:
  build-android-beta:
    name: Build signed Android Beta APK & AAB (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      LIQUID_SKIP_YTDLP_DOWNLOAD: '1'
      LIQUID_ANDROID_VERSION_NAME: 2.2.0-beta.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute Android Beta versionCode
        shell: bash
        run: |
          echo "LIQUID_ANDROID_VERSION_CODE=$((20200 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35 & NDK 27
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android-arm64

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Android Beta manifest config
        run: pnpm android:check

      - name: Build frontend bundle and stage catalog metadata
        run: node scripts/build.mjs

      - name: Initialize Tauri Android project
        run: pnpm exec tauri android init --ci

      - name: Apply Liquid Hub native Android media service, manifest & signing setup
        run: node scripts/android-setup.mjs

      - name: Configure Beta APK/AAB signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          KS_PATH="${RUNNER_TEMP}/liquid-hub-beta.keystore"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            KS_PASS="${ANDROID_KEYSTORE_PASS:?ANDROID_KEYSTORE_PASS secret required}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS:-liquidhub}"
            KEY_PASS="${ANDROID_KEY_PASS:-$KS_PASS}"
            echo "Using repository release keystore."
          else
            KS_PASS="liquidhub-beta-keystore"
            KEY_ALIAS="liquidhub"
            KEY_PASS="liquidhub-beta-keystore"
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Liquid Hub Android Beta, OU=Mobile, O=Liquid Hub, L=Sao Paulo, ST=SP, C=BR"
            echo "Generated signed Beta keystore for sideloadable APK & AAB."
          fi
          echo "LIQUID_ANDROID_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "LIQUID_ANDROID_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "LIQUID_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LIQUID_ANDROID_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build signed Android Beta APK (arm64-v8a)
        run: pnpm exec tauri android build --apk --target aarch64

      - name: Build signed Android Beta AAB (arm64-v8a)
        run: pnpm exec tauri android build --aab --target aarch64

      - name: Stage and verify APK & AAB artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/android-beta-dist"
          mkdir -p "$OUT_DIR"

          APK_FILE="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*-unsigned.apk' | head -n 1 || true)"
          if [ -z "$APK_FILE" ]; then
            APK_FILE="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1 || true)"
          fi
          AAB_FILE="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' | head -n 1 || true)"

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Built APK not found!" >&2
            find src-tauri/gen/android/app/build/outputs -maxdepth 4 || true
            exit 1
          fi
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "Built AAB not found!" >&2
            find src-tauri/gen/android/app/build/outputs -maxdepth 4 || true
            exit 1
          fi

          cp "$APK_FILE" "$OUT_DIR/Liquid-Hub-beta-arm64.apk"
          cp "$AAB_FILE" "$OUT_DIR/Liquid-Hub-beta-arm64.aab"

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$OUT_DIR/Liquid-Hub-beta-arm64.apk"
          fi

          (cd "$OUT_DIR" && sha256sum Liquid-Hub-beta-arm64.apk Liquid-Hub-beta-arm64.aab > SHA256SUMS-android-beta.txt)
          ls -lh "$OUT_DIR"
          cat "$OUT_DIR/SHA256SUMS-android-beta.txt"

      - name: Upload Android Beta APK & AAB workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liquid-hub-android-beta-${{ env.LIQUID_ANDROID_VERSION_NAME }}
          path: ${{ runner.temp }}/android-beta-dist/*
          retention-days: 30

      - name: Publish Android Beta prerelease to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/android-beta-dist"
          NOTES_FILE="${RUNNER_TEMP}/android-beta-notes.md"
          cat > "$NOTES_FILE" <<EOF
          ## Liquid Hub Android Beta (${LIQUID_ANDROID_VERSION_NAME})

          Build nativo Android **Tauri v2 Mobile (arm64-v8a)** com:
          - Reprodução em segundo plano com serviço foreground \`mediaPlayback\` (\`LiquidHubMediaPlaybackService\`)
          - Controles na notificação, tela de bloqueio e headsets Bluetooth (\`MediaSession\` + \`ACTION_AUDIO_BECOMING_NOISY\`)
          - Recuperação automática de foco de áudio (\`AudioFocusRequest\`) e \`PARTIAL_WAKE_LOCK\` somente durante reprodução ativa
          - Cofre criptografado AES-256-GCM no dispositivo (zero tokens em texto puro ou \`localStorage\`)
          - Deep links \`liquidhub://\` (auth, JAM, perfil, playlist e faixa)
          - Navegação mobile nativa (\`MobileBottomNav\`) e JAM inline

          ### Arquivos
          - **\`Liquid-Hub-beta-arm64.apk\`** — instalação direta (sideload) em Android 8.0+ (API 26+)
          - **\`Liquid-Hub-beta-arm64.aab\`** — Android App Bundle pronto para Google Play Internal/Closed Testing

          \`\`\`
          $(cat "$OUT_DIR/SHA256SUMS-android-beta.txt")
          \`\`\`
          EOF

          if gh release view android-beta >/dev/null 2>&1; then
            gh release edit android-beta \
              --title "Liquid Hub Android Beta (${LIQUID_ANDROID_VERSION_NAME})" \
              --notes-file "$NOTES_FILE" \
              --prerelease
            gh release upload android-beta \
              "$OUT_DIR/Liquid-Hub-beta-arm64.apk" \
              "$OUT_DIR/Liquid-Hub-beta-arm64.aab" \
              "$OUT_DIR/SHA256SUMS-android-beta.txt" \
              --clobber
          else
            gh release create android-beta \
              "$OUT_DIR/Liquid-Hub-beta-arm64.apk" \
              "$OUT_DIR/Liquid-Hub-beta-arm64.aab" \
              "$OUT_DIR/SHA256SUMS-android-beta.txt" \
              --title "Liquid Hub Android Beta (${LIQUID_ANDROID_VERSION_NAME})" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
