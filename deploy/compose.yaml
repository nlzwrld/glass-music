services:
  catalog:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      CATALOG_HOST: 0.0.0.0
      PORT: 8788
      CATALOG_TRUSTED_PROXY_IPS: 172.30.0.2
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 1
    networks:
      liquid:
        ipv4_address: 172.30.0.3
  jam:
    build:
      context: ..
      dockerfile: server/Dockerfile.jam
    environment:
      JAM_HOST: 0.0.0.0
      PORT: 8789
      JAM_MAX_ROOMS: 2500
      JAM_STRICT_REPLAY: "1"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 1
    networks:
      liquid:
        ipv4_address: 172.30.0.4
  gateway:
    image: caddy:2-alpine
    environment:
      CATALOG_DOMAIN: ${CATALOG_DOMAIN:?Defina CATALOG_DOMAIN no arquivo .env}
      JAM_DOMAIN: ${JAM_DOMAIN:-jam.localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      catalog:
        condition: service_healthy
      jam:
        condition: service_healthy
    networks:
      liquid:
        ipv4_address: 172.30.0.2
networks:
  liquid:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  caddy_data:
  caddy_config:
