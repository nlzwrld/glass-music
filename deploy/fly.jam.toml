# Fly.io optimized configuration with auto-stop/start hibernation
app = "liquid-hub-jam"
primary_region = "gru"

[build]
  dockerfile = "../server/Dockerfile.jam"

[env]
  JAM_HOST = "0.0.0.0"
  PORT = "8789"
  JAM_MAX_ROOMS = "2500"
  JAM_STRICT_REPLAY = "1"
  # Opt-in somente porque este serviço é acessado pelo proxy da Fly.
  JAM_TRUST_FLY_CLIENT_IP = "1"

[http_service]
  internal_port = 8789
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "4s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
